<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Anointed Staff" />
    <!--
      Local-first desk CSP: self-hosted fonts; Excalidraw still needs unsafe-eval.
      connect-src stays open for user-configured model / STT / SearXNG hosts.
      frame-ancestors none blocks clickjacking when the web build is hosted.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; connect-src 'self' https: http: ws: wss:;"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Anointed Staff</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
