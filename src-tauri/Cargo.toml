[package]
name = "anointed-staff"
version = "0.1.0"
description = "Anointed Staff — local-first Scripture desk"
authors = ["Anointed Staff"]
edition = "2021"

[lib]
name = "anointed_staff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
